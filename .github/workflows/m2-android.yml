name: M2 Maven Android ART

on:
  push:
    branches: [work/spake2-maven-migration]
    paths:
      - '.github/workflows/m2-android.yml'
      - 'validation/m2-maven/android/**'
      - 'validation/android-runtime/**'
      - 'validation/pairing-peer/**'
      - 'kadb/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'scripts/source_bundle.py'
      - 'scripts/prepare_spake2_candidate.py'
      - 'validation/source-bundle/dependencies.lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  android-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore the unchanged fixed Maven candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          uname -a | tee evidence/host.log
          python3 scripts/prepare_spake2_candidate.py | tee evidence/spake2-repository.txt
          python3 scripts/source_bundle.py verify-spake2-maven --output evidence/spake2-candidate-integrity.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: m1-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Record toolchain and install SDK inputs
        run: |
          set -euo pipefail
          java -version 2>&1 | tee evidence/java-version.log
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/android-sdk.log
          ./gradlew --version 2>&1 | tee evidence/gradle-version.log
          cp gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties evidence/
      - name: Build the real APK and independent peer with Maven provenance gates
        id: build
        run: |
          set -euo pipefail
          ./gradlew :kadb:verifyProductionTargetScope :kadb:bundleAndroidMainAar :validation-android-runtime:assembleDebug :validation-pairing-peer:writePeerClasspath :kadb:verifySpake2MavenResolution --no-configuration-cache --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/android-build.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/
          python3 scripts/source_bundle.py verify-spake2-maven --spake2-resolution-report evidence/spake2-maven-resolution.json --output evidence/spake2-resolved-source-verification.json
      - name: Inspect APK DEX, signature and actual runtime dependency graph
        id: runtime-source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s validation/android-runtime -p 'test_*.py' -v 2>&1 | tee evidence/android-runtime-gates.log
          python3 -B -m unittest discover -s validation/source-bundle -p 'test_*.py' -k android -v 2>&1 | tee evidence/android-source-gates.log
          apk=validation/android-runtime/build/outputs/apk/debug/validation-android-runtime-debug.apk
          python3 validation/android-runtime/inspect_apk.py "$apk" --output evidence/android-runtime-apk.json
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk" | tee evidence/android-runtime-signature.log
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > evidence/android-runtime-badging.log
          ./gradlew -I validation/android-runtime/runtime-classpath.init.gradle :validation-android-runtime:recordRuntimeClasspath --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/android-runtime-classpath.log
          cp validation/android-runtime/build/reports/debug-runtime-classpath.json evidence/
          python3 scripts/source_bundle.py verify-android-runtime --runtime-report evidence/debug-runtime-classpath.json --output evidence/android-runtime-source-verification.json 2>&1 | tee evidence/android-runtime-source-verification.log
      - name: Preserve APK provenance immediately before emulator work
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-android-provenance-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: |
            evidence/*.json
            evidence/*.log
      - name: Collect complete corresponding source for this exact APK checkout
        id: source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/corresponding-source --cache "$RUNNER_TEMP/kadb-source-cache" --spake2-resolution-report evidence/spake2-maven-resolution.json --binary kadb-android-aar=kadb/build/outputs/aar/kadb.aar 2>&1 | tee evidence/source-create.log
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          result = json.loads(Path('evidence/corresponding-source/source-bundle-result.json').read_text())
          assert result['status'] == 'verified' and result['kadb_commit'] == os.environ['GITHUB_SHA']
          lock_sha = hashlib.sha256(Path('validation/source-bundle/dependencies.lock.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha256={result['sha256']}\nlock-sha256={lock_sha}\n")
          PY
      - name: Preserve the complete source package before runtime execution
        id: source-upload
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corresponding-source-${{ github.sha }}
          path: evidence/corresponding-source/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Associate exact APK bytes with verified source and runtime inventory
        id: association
        if: ${{ !cancelled() && steps.source-upload.outcome == 'success' && steps.runtime-source.outcome == 'success' }}
        run: python3 validation/record-binary-evidence.py --source-url '${{ steps.source-upload.outputs.artifact-url }}' --source-sha256 '${{ steps.source.outputs.sha256 }}' --source-lock-sha256 '${{ steps.source.outputs.lock-sha256 }}' --output evidence
      # The baseline booted in ~30s; its Native driver then switched adbd to
      # TCP mode and left the emulator transport offline before ART started.
      # This M2 job runs ART on a fresh emulator without that M3 mode change.
      - name: Provision one disposable accelerated emulator
        id: provision
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update > evidence/host-packages.log 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libglu1-mesa >> evidence/host-packages.log 2>&1
          dpkg-query -W libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libglu1-mesa > evidence/host-package-versions.log
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tee evidence/emulator-sdk.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/kadb-m2-android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kadb-m2-avd"
          export ANDROID_ADB_SERVER_PORT=5038
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb keygen "$ANDROID_USER_HOME/adbkey"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME/adbkey"
          printf 'no\n' | avdmanager create avd --name kadb_m2_runtime --package 'system-images;android-35;google_apis;x86_64'
          adb -P 5038 start-server
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee evidence/emulator-acceleration.log
          "$ANDROID_HOME/emulator/emulator" -avd kadb_m2_runtime -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader -memory 4096 -cores 2 -camera-back none -camera-front none > evidence/emulator.log 2>&1 &
          printf 'KADB_EMULATOR_PID=%s\nANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_ADB_SERVER_PORT=5038\nADB_VENDOR_KEYS=%s\n' "$!" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$ADB_VENDOR_KEYS" >> "$GITHUB_ENV"
          cp "$ANDROID_HOME/emulator/source.properties" evidence/emulator-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" evidence/system-image-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml" evidence/system-image-package.xml
      - name: Require boot and package manager readiness with bounded diagnostics
        id: ready
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: python3 validation/m2-maven/android/wait_ready.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --adb-server-port 5038 --timeout 120 --output evidence/emulator-readiness
      - name: Execute all nine Android ART checks and two independent peer sessions
        id: art
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          apk=validation/android-runtime/build/outputs/apk/debug/validation-android-runtime-debug.apk
          python3 validation/android-runtime/run_android_runtime.py --serial emulator-5554 --adb-server-port 5038 --adb "$ANDROID_HOME/platform-tools/adb" --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --apk "$apk" --output evidence/android-runtime 2>&1 | tee evidence/android-runtime-driver.log
      - name: Preserve emulator diagnostics and stop only this job's emulator
        if: always()
        run: |
          timeout --kill-after=5s 15s adb -P 5038 devices -l > evidence/adb-final-devices.log 2>&1 || true
          timeout --kill-after=5s 20s adb -P 5038 -s emulator-5554 shell getprop > evidence/emulator-final-properties.log 2>&1 || true
          timeout --kill-after=5s 20s adb -P 5038 -s emulator-5554 logcat -d -v threadtime > evidence/emulator-logcat.log 2>&1 || true
          timeout --kill-after=5s 15s adb -P 5038 -s emulator-5554 emu kill || true
          if [ -n "${KADB_EMULATOR_PID:-}" ]; then kill "$KADB_EMULATOR_PID" 2>/dev/null || true; fi
      - name: Record separate build, provenance, environment and protocol states
        if: always()
        env:
          M2_CANDIDATE: ${{ steps.candidate.outcome }}
          M2_BUILD: ${{ steps.build.outcome }}
          M2_RUNTIME_SOURCE: ${{ steps.runtime-source.outcome }}
          M2_SOURCE: ${{ steps.source.outcome }}
          M2_ASSOCIATION: ${{ steps.association.outcome }}
          M2_PROVISION: ${{ steps.provision.outcome }}
          M2_READY: ${{ steps.ready.outcome }}
          M2_ART: ${{ steps.art.outcome }}
        run: python3 validation/m2-maven/android/summarize.py --evidence evidence
      - name: Preserve actual Android M2 evidence and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-android-art-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            evidence/
            !evidence/corresponding-source/*.tar.gz
            kadb/build/reports/spake2-maven-resolution.json
            kadb/build/outputs/aar/
            validation/android-runtime/build/outputs/apk/debug/*.apk
            validation/android-runtime/build/reports/debug-runtime-classpath.json
            validation/pairing-peer/build/reference-classpath.txt
