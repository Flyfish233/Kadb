name: Native-core experiment

on:
  push:
    branches: [experiment/kmp-native-core]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'validation/m1/**'
      - '.github/workflows/experiment-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  android-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Freeze environment and verify upstream source bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/corresponding-source.tar.gz HEAD
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/sdk.log
          (cd third-party/spake2 && sha256sum --check SHA256SUMS) | tee evidence/spake-source-check.log
      - name: Real Android AAR, host regressions and independent JVM reference
        run: |
          set -o pipefail
          ./gradlew :kadb:testAndroidHostTest :kadb:jvmTest :kadb-mdns:jvmTest :kadb:bundleAndroidMainAar :kadb-mdns:bundleAndroidMainAar :validation-android-fixture:assembleDebug --console=plain --stacktrace 2>&1 | tee evidence/android-protocol.log
      - name: Require executed tests
        if: always()
        run: python3 validation/summarize-tests.py . --output evidence/test-summary.json --require kadb/build/test-results/jvmTest --require testAndroidHostTest --require kadb-mdns/build/test-results/jvmTest
      - name: Compare actual Android public ABI
        run: |
          set -euo pipefail
          python3 validation/capture-kotlin-abi.py kadb/build/outputs/aar/kadb.aar evidence/current-android.api
          python3 validation/capture-kotlin-abi.py kadb-mdns/build/outputs/aar/kadb-mdns.aar evidence/current-mdns-android.api
          diff -u validation/baseline/baseline-android.api evidence/current-android.api | tee evidence/android-api.diff
          diff -u validation/baseline/baseline-mdns-android.api evidence/current-mdns-android.api | tee evidence/mdns-api.diff
          python3 validation/capture-jvm-abi.py kadb/build/outputs/aar/kadb.aar evidence/current-android.abi
          # The broader inventory includes implementation internals. Preserve its
          # changes for review; the Kotlin-public comparison above is the gate.
          diff -u validation/baseline/baseline-android.abi evidence/current-android.abi > evidence/android-bytecode.diff || test "$?" = 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-protocol-${{ github.sha }}
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            **/build/outputs/aar/
            validation/android-fixture/build/outputs/apk/debug/

  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile, link and execute Linux Native
        run: |
          set -o pipefail
          mkdir -p evidence
          cmake --version | tee evidence/cmake.log
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/corresponding-source.tar.gz HEAD
          ./gradlew :kadb:linuxX64Test :validation-native-adbd:linkDebugExecutableLinuxX64 --console=plain --stacktrace 2>&1 | tee evidence/linux-native.log
      - name: Require actual Native test reports and executable
        if: always()
        run: |
          python3 validation/summarize-tests.py . --output evidence/native-summary.json --require kadb/build/test-results/linuxX64Test
          test -x validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe
          file validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe | tee evidence/consumer-file.log
      - name: C transport regression and sanitizers
        run: |
          set -o pipefail
          KADB_SANITIZE=1 scripts/test-native-c.sh "$PWD/kadb/build/native/boringssl-5b83e5d1abf0ae0033ae52ab579d906b67633b2c" "$PWD/kadb/build/native/linuxX64/cmake" 2>&1 | tee evidence/native-c.log
      - name: Independent BoringSSL SPAKE oracle
        run: |
          set -o pipefail
          python3 validation/spake2/replay_oracle.py --oracle "$PWD/evidence/spake-oracle" --report evidence/spake-oracle.json --reference-source "$PWD/kadb/build/native/boringssl-5b83e5d1abf0ae0033ae52ab579d906b67633b2c" --reference-commit 5b83e5d1abf0ae0033ae52ab579d906b67633b2c --libcrypto "$PWD/kadb/build/native/linuxX64/cmake/lib/libcrypto.a" 2>&1 | tee evidence/spake-oracle.log
          python3 -m unittest discover -s validation/native-adbd -p 'test_*.py' -v 2>&1 | tee evidence/observer-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-native-${{ github.sha }}
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            kadb/build/bin/linuxX64/
            kadb/build/classes/kotlin/linuxX64/
            validation/native-adbd/build/bin/linuxX64/
            kadb/build/native/linuxX64/cmake/Testing/

  darwin-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: MacosArm64
            directory: macosArm64
          - runner: macos-15-intel
            architecture: x86_64
            target: MacosX64
            directory: macosX64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Toolchain identity
        run: |
          mkdir -p evidence
          test "$(uname -m)" = '${{ matrix.architecture }}'
          xcodebuild -version | tee evidence/xcode.log
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/corresponding-source.tar.gz HEAD
      - name: macOS Native build, execution and framework
        run: |
          set -o pipefail
          ./gradlew :kadb:${{ matrix.directory }}Test :kadb-mdns:${{ matrix.directory }}Test :kadb:linkDebugFramework${{ matrix.target }} :validation-native-adbd:linkDebugExecutable${{ matrix.target }} --console=plain --stacktrace 2>&1 | tee evidence/macos-native.log
      - name: External Swift consumer
        run: validation/swift/run-macos.sh kadb/build/bin/${{ matrix.directory }}/debugFramework evidence
      - name: Boot iOS Simulator
        if: matrix.architecture == 'arm64'
        run: python3 validation/boot-simulator.py
      - name: iOS device framework and actual simulator tests
        if: matrix.architecture == 'arm64'
        run: |
          set -o pipefail
          device=$(cat evidence/simulator-udid.txt)
          ./gradlew :kadb:iosSimulatorArm64Test :kadb-mdns:iosSimulatorArm64Test :kadb:linkDebugFrameworkIosArm64 :kadb:linkDebugFrameworkIosSimulatorArm64 -PiosSimulatorDevice="$device" --console=plain --stacktrace 2>&1 | tee evidence/ios-simulator.log
      - name: Require executed Native reports
        if: always()
        run: |
          args=(--require kadb/build/test-results/${{ matrix.directory }}Test --require kadb-mdns/build/test-results/${{ matrix.directory }}Test)
          if [ '${{ matrix.architecture }}' = arm64 ]; then
            args+=(--require kadb/build/test-results/iosSimulatorArm64Test --require kadb-mdns/build/test-results/iosSimulatorArm64Test)
          fi
          python3 validation/summarize-tests.py . --output evidence/darwin-summary.json "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-${{ matrix.directory }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            kadb/build/bin/
            kadb-mdns/build/bin/
            validation/native-adbd/build/bin/
