name: Native-core experiment

on:
  push:
    branches: [experiment/kmp-native-core]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'validation/m1/**'
      - '.github/workflows/experiment-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  corresponding-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-url: ${{ steps.upload-source.outputs.artifact-url }}
      package-sha256: ${{ steps.source-metadata.outputs.package-sha256 }}
      lock-sha256: ${{ steps.source-metadata.outputs.lock-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: native-library-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Verify collector and create the actual pinned source package
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s validation/source-bundle -p 'test_*.py' -v 2>&1 | tee evidence/source-tests.log
          python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/native-source --cache "$RUNNER_TEMP/kadb-source-cache" 2>&1 | tee evidence/source-create.log
      - name: Read verified package identity
        id: source-metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('evidence/native-source')
          result = json.loads((folder / 'source-bundle-result.json').read_text())
          manifest = json.loads((folder / 'source-bundle-manifest.json').read_text())
          assert result['status'] == 'verified'
          assert result['kadb_commit'] == os.environ['GITHUB_SHA']
          assert manifest['kadb_commit'] == os.environ['GITHUB_SHA']
          lock_hash = hashlib.sha256(Path('validation/source-bundle/dependencies.lock.json').read_bytes()).hexdigest()
          assert manifest['source_lock_sha256'] == lock_hash
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"package-sha256={result['sha256']}\nlock-sha256={lock_hash}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload-source
        with:
          name: corresponding-source-${{ github.sha }}
          path: evidence/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: source-collection-failure-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn

  android-and-protocol:
    needs: corresponding-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Freeze environment and verify upstream source bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/kadb-source.tar.gz HEAD
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/sdk.log
          (cd third-party/spake2 && sha256sum --check SHA256SUMS) | tee evidence/spake-source-check.log
      - name: Real Android AAR and retained host regressions
        run: |
          set -o pipefail
          ./gradlew :kadb:verifyProductionTargetScope :kadb-mdns:verifyProductionTargetScope :spake2-legacy:verifyProductionTargetScope :kadb:testAndroidHostTest :kadb-mdns:testAndroidHostTest :kadb:bundleAndroidMainAar :kadb-mdns:bundleAndroidMainAar :validation-android-fixture:assembleDebug :validation-android-runtime:assembleDebug --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/android-protocol.log
      - name: Inspect the real Android runtime APK and its source inventory
        id: runtime-source-gate
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s validation/android-runtime -p 'test_*.py' -v 2>&1 | tee evidence/android-runtime-gates.log
          apk=validation/android-runtime/build/outputs/apk/debug/validation-android-runtime-debug.apk
          python3 validation/android-runtime/inspect_apk.py "$apk" --output evidence/android-runtime-apk.json
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk" | tee evidence/android-runtime-signature.log
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > evidence/android-runtime-badging.log
          ./gradlew -I validation/android-runtime/runtime-classpath.init.gradle :validation-android-runtime:recordRuntimeClasspath --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/android-runtime-classpath.log
          cp validation/android-runtime/build/reports/debug-runtime-classpath.json evidence/
          python3 scripts/source_bundle.py verify-android-runtime --lock validation/source-bundle/dependencies.lock.json --runtime-report evidence/debug-runtime-classpath.json --output evidence/android-runtime-source-verification.json
      - name: Require executed tests
        if: always()
        run: python3 validation/summarize-tests.py . --output evidence/test-summary.json --require kadb/build/test-results/testAndroidHostTest --require kadb-mdns/build/test-results/testAndroidHostTest
      - name: Compare actual Android public ABI
        run: |
          set -euo pipefail
          python3 validation/capture-kotlin-abi.py kadb/build/outputs/aar/kadb.aar evidence/current-android.api
          python3 validation/capture-kotlin-abi.py kadb-mdns/build/outputs/aar/kadb-mdns.aar evidence/current-mdns-android.api
          diff -u validation/baseline/baseline-android.api evidence/current-android.api | tee evidence/android-api.diff
          diff -u validation/baseline/baseline-mdns-android.api evidence/current-mdns-android.api | tee evidence/mdns-api.diff
          python3 validation/capture-jvm-abi.py kadb/build/outputs/aar/kadb.aar evidence/current-android.abi
          # The broader inventory includes implementation internals. Preserve its
          # changes for review; the Kotlin-public comparison above is the gate.
          diff -u validation/baseline/baseline-android.abi evidence/current-android.abi > evidence/android-bytecode.diff || test "$?" = 1
      - name: Associate actual artifacts with the uploaded source package
        if: always()
        run: python3 validation/record-binary-evidence.py --source-url '${{ needs.corresponding-source.outputs.artifact-url }}' --source-sha256 '${{ needs.corresponding-source.outputs.package-sha256 }}' --source-lock-sha256 '${{ needs.corresponding-source.outputs.lock-sha256 }}' --output evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-protocol-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            **/build/outputs/aar/
            validation/android-fixture/build/outputs/apk/debug/
            ${{ steps.runtime-source-gate.outcome == 'success' && 'validation/android-runtime/build/outputs/apk/debug/' || '' }}

  linux-native:
    needs: corresponding-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile, link and execute Linux Native
        run: |
          set -o pipefail
          mkdir -p evidence
          cmake --version | tee evidence/cmake.log
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/kadb-source.tar.gz HEAD
          ./gradlew :kadb:linuxX64Test :kadb-mdns:linuxX64Test :validation-native-adbd:linkDebugExecutableLinuxX64 :validation-native-adbd:linkPairingDebugExecutableLinuxX64 :validation-pairing-peer:writePeerClasspath --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/linux-native.log
      - name: Require actual Native test reports and executable
        if: always()
        run: |
          python3 validation/summarize-tests.py . --output evidence/native-summary.json --require kadb/build/test-results/linuxX64Test --require kadb-mdns/build/test-results/linuxX64Test
          test -x validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe
          file validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe | tee evidence/consumer-file.log
      - name: External Native pairing against independent Java peer
        run: python3 validation/pairing-peer/run_interop.py --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --consumer validation/native-adbd/build/bin/linuxX64/pairingDebugExecutable/kadb-native-pairing.kexe --output evidence/pairing-linux
      - name: C transport regression and sanitizers
        run: |
          set -o pipefail
          KADB_SANITIZE=1 scripts/test-native-c.sh "$PWD/kadb/build/native/boringssl-5b83e5d1abf0ae0033ae52ab579d906b67633b2c" "$PWD/kadb/build/native/linuxX64/cmake" 2>&1 | tee evidence/native-c.log
      - name: Independent BoringSSL SPAKE oracle
        run: |
          set -o pipefail
          python3 validation/spake2/replay_oracle.py --oracle "$PWD/evidence/spake-oracle" --report evidence/spake-oracle.json --reference-source "$PWD/kadb/build/native/boringssl-5b83e5d1abf0ae0033ae52ab579d906b67633b2c" --reference-commit 5b83e5d1abf0ae0033ae52ab579d906b67633b2c --libcrypto "$PWD/kadb/build/native/linuxX64/cmake/lib/libcrypto.a" 2>&1 | tee evidence/spake-oracle.log
          python3 -m unittest discover -s validation/native-adbd -p 'test_*.py' -v 2>&1 | tee evidence/observer-tests.log
      - name: Associate actual artifacts with the uploaded source package
        if: always()
        run: python3 validation/record-binary-evidence.py --source-url '${{ needs.corresponding-source.outputs.artifact-url }}' --source-sha256 '${{ needs.corresponding-source.outputs.package-sha256 }}' --source-lock-sha256 '${{ needs.corresponding-source.outputs.lock-sha256 }}' --output evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-native-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            kadb/build/bin/linuxX64/
            kadb/build/classes/kotlin/linuxX64/
            validation/native-adbd/build/bin/linuxX64/
            kadb/build/native/linuxX64/cmake/Testing/

  darwin-native:
    needs: corresponding-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
            target: MacosArm64
            directory: macosArm64
          - runner: macos-26-intel
            architecture: x86_64
            target: MacosX64
            directory: macosX64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      # Kotlin/Native 2.4.20 platform bindings use the Xcode 26.4 SDK family.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Toolchain identity
        run: |
          mkdir -p evidence
          test "$(uname -m)" = '${{ matrix.architecture }}'
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee evidence/xcode.log
          xcrun --sdk macosx --show-sdk-version | tee evidence/macos-sdk.log
          xcrun --sdk iphoneos --show-sdk-version | tee evidence/ios-sdk.log
          git rev-parse HEAD | tee evidence/commit.txt
          git archive --format=tar.gz --output=evidence/kadb-source.tar.gz HEAD
      - name: macOS Native build, execution and framework
        id: macos-build
        run: |
          set -o pipefail
          ./gradlew :kadb:${{ matrix.directory }}Test :kadb-mdns:${{ matrix.directory }}Test :kadb:linkDebugFramework${{ matrix.target }} :validation-native-adbd:linkDebugExecutable${{ matrix.target }} :validation-native-adbd:linkPairingDebugExecutable${{ matrix.target }} :validation-pairing-peer:writePeerClasspath --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/macos-native.log
      - name: External macOS pairing against independent Java peer
        run: python3 validation/pairing-peer/run_interop.py --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --consumer validation/native-adbd/build/bin/${{ matrix.directory }}/pairingDebugExecutable/kadb-native-pairing.kexe --output evidence/pairing-macos
      - name: External Swift consumer
        if: always() && steps.macos-build.outcome == 'success'
        run: validation/swift/run-macos.sh kadb/build/bin/${{ matrix.directory }}/debugFramework evidence
      - name: Inspect actual macOS deployment metadata
        if: always() && steps.macos-build.outcome == 'success'
        run: python3 validation/inspect-apple-artifact.py --artifact kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Kadb --architecture '${{ matrix.architecture }}' --platform macos --maximum-minimum-os 12.0 --output evidence/macos-framework-metadata.json
      - name: Boot iOS Simulator
        id: ios-boot
        if: always() && matrix.architecture == 'arm64' && steps.macos-build.outcome == 'success'
        run: python3 validation/boot-simulator.py
      - name: iOS device framework and actual simulator tests
        id: ios-build
        if: always() && matrix.architecture == 'arm64' && steps.ios-boot.outcome == 'success'
        run: |
          set -o pipefail
          device=$(cat evidence/simulator-udid.txt)
          ./gradlew :kadb:iosSimulatorArm64Test :kadb-mdns:iosSimulatorArm64Test :kadb:linkDebugFrameworkIosArm64 :kadb:linkDebugFrameworkIosSimulatorArm64 :validation-native-adbd:linkPairingDebugExecutableIosSimulatorArm64 -PiosSimulatorDevice="$device" --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/ios-simulator.log
      - name: Actual simulator pairing and exported API comparison
        if: always() && matrix.architecture == 'arm64' && steps.ios-build.outcome == 'success'
        run: |
          set -euo pipefail
          python3 validation/pairing-peer/run_interop.py --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --consumer validation/native-adbd/build/bin/iosSimulatorArm64/pairingDebugExecutable/kadb-native-pairing.kexe --simulator-udid "$(cat evidence/simulator-udid.txt)" --output evidence/pairing-simulator
          python3 validation/compare-objc-api.py validation/baseline/darwin/Kadb-iosSimulatorArm64.h kadb/build/bin/iosSimulatorArm64/debugFramework/Kadb.framework/Headers/Kadb.h --report evidence/objc-api.json
          python3 validation/inspect-apple-artifact.py --artifact kadb/build/bin/iosArm64/debugFramework/Kadb.framework/Kadb --architecture arm64 --platform ios --maximum-minimum-os 15.0 --output evidence/ios-device-framework-metadata.json
          python3 validation/inspect-apple-artifact.py --artifact kadb/build/bin/iosSimulatorArm64/debugFramework/Kadb.framework/Kadb --architecture arm64 --platform ios-simulator --maximum-minimum-os 15.0 --output evidence/ios-simulator-framework-metadata.json
      - name: Require executed Native reports
        if: always()
        run: |
          args=(--require kadb/build/test-results/${{ matrix.directory }}Test --require kadb-mdns/build/test-results/${{ matrix.directory }}Test)
          if [ '${{ matrix.architecture }}' = arm64 ]; then
            args+=(--require kadb/build/test-results/iosSimulatorArm64Test --require kadb-mdns/build/test-results/iosSimulatorArm64Test)
          fi
          python3 validation/summarize-tests.py . --output evidence/darwin-summary.json "${args[@]}"
      - name: Associate actual artifacts with the uploaded source package
        if: always()
        run: python3 validation/record-binary-evidence.py --source-url '${{ needs.corresponding-source.outputs.artifact-url }}' --source-sha256 '${{ needs.corresponding-source.outputs.package-sha256 }}' --source-lock-sha256 '${{ needs.corresponding-source.outputs.lock-sha256 }}' --output evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-${{ matrix.directory }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            evidence/
            **/build/test-results/
            **/build/reports/tests/
            kadb/build/bin/
            kadb-mdns/build/bin/
            validation/native-adbd/build/bin/

  emulator-adbd:
    needs: [android-and-protocol, linux-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-native-${{ github.sha }}
          path: incoming/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-protocol-${{ github.sha }}
          path: incoming/android
      - name: Provision disposable accelerated emulator
        id: provision-emulator
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update > evidence/host-packages.log 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libglu1-mesa >> evidence/host-packages.log 2>&1
          dpkg-query -W libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libglu1-mesa > evidence/host-package-versions.log
          sdkmanager 'emulator' 'platform-tools' 'build-tools;37.0.0' 'system-images;android-35;google_apis;x86_64' 2>&1 | tee evidence/emulator-sdk.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/kadb-android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kadb-avd"
          export ANDROID_ADB_SERVER_PORT=5038
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb keygen "$ANDROID_USER_HOME/adbkey"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME/adbkey"
          printf 'no\n' | avdmanager create avd --name kadb_native_validation --package 'system-images;android-35;google_apis;x86_64'
          adb -P 5038 start-server
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee evidence/emulator-acceleration.log
          "$ANDROID_HOME/emulator/emulator" -avd kadb_native_validation -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader > evidence/emulator.log 2>&1 &
          printf 'KADB_EMULATOR_PID=%s\nANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_ADB_SERVER_PORT=5038\nADB_VENDOR_KEYS=%s\n' "$!" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$ADB_VENDOR_KEYS" >> "$GITHUB_ENV"
          cp "$ANDROID_HOME/emulator/source.properties" evidence/emulator-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" evidence/system-image-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml" evidence/system-image-package.xml
          timeout 180 adb -P 5038 -s emulator-5554 wait-for-device
      - name: Build the independent Android pairing reference on this host
        id: android-peer
        run: |
          set -o pipefail
          ./gradlew :validation-pairing-peer:writePeerClasspath --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/android-peer-build.log
      - name: Execute public Native API against actual emulator adbd
        if: always() && steps.provision-emulator.outcome == 'success'
        run: |
          set -o pipefail
          consumer=incoming/linux/validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe
          apk=incoming/android/validation/android-fixture/build/outputs/apk/debug/validation-android-fixture-debug.apk
          chmod +x "$consumer"
          python3 validation/native-adbd/run_emulator.py --serial emulator-5554 --adb-server-port 5038 --adb "$ANDROID_HOME/platform-tools/adb" --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --emulator "$ANDROID_HOME/emulator/emulator" --consumer "$consumer" --apk "$apk" --output evidence/adbd 2>&1 | tee evidence/adbd-driver.log
      - name: Execute the actual Android APK and platform TLS exporter on ART
        if: always() && steps.provision-emulator.outcome == 'success' && steps.android-peer.outcome == 'success'
        run: |
          set -o pipefail
          apk=incoming/android/validation/android-runtime/build/outputs/apk/debug/validation-android-runtime-debug.apk
          python3 validation/android-runtime/run_android_runtime.py --serial emulator-5554 --adb-server-port 5038 --adb "$ANDROID_HOME/platform-tools/adb" --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --apk "$apk" --output evidence/android-runtime 2>&1 | tee evidence/android-runtime-driver.log
      - name: Stop only this job's emulator
        if: always()
        run: |
          adb -P 5038 -s emulator-5554 emu kill || true
          if [ -n "${KADB_EMULATOR_PID:-}" ]; then kill "$KADB_EMULATOR_PID" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emulator-adbd-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: evidence/
