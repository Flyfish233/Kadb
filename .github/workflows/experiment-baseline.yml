name: Frozen iOS baseline

on:
  push:
    branches: [experiment/kmp-native-core]
    paths:
      - .github/workflows/experiment-baseline.yml
      - validation/baseline/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-android-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75678915fd4bdd52345edbb6bc4913ae3415a680
          path: baseline
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: SDK and environment
        run: |
          mkdir -p evidence
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/sdk.log
          java -version 2>&1 | tee evidence/java.log
          git -C baseline rev-parse HEAD | tee evidence/source-sha.txt
      - name: Frozen JVM behavior and Android host tests
        working-directory: baseline
        run: |
          set -o pipefail
          ./gradlew :kadb:jvmTest :kadb-mdns:jvmTest :kadb:testAndroidHostTest :kadb:jvmJar --console=plain --stacktrace 2>&1 | tee ../evidence/baseline-gradle.log
      - name: Require executed test reports
        if: always()
        run: python3 validation/summarize-tests.py baseline --output evidence/test-summary.json --require kadb/build/test-results/jvmTest --require kadb-mdns/build/test-results/jvmTest --require testAndroidHostTest
      - name: JVM bytecode inventory
        run: |
          for jar in baseline/kadb/build/libs/*-jvm*.jar; do
            case "$jar" in *sources*|*javadoc*) continue;; esac
            python3 validation/capture-jvm-abi.py "$jar" evidence/baseline-jvm.abi
          done
          test -s evidence/baseline-jvm.abi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-baseline-jvm-android
          if-no-files-found: error
          path: |
            evidence/
            baseline/**/build/test-results/
            baseline/**/build/reports/tests/
            baseline/kadb/build/libs/
            baseline/kadb/build/outputs/aar/
