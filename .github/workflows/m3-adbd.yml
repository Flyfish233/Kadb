name: M3 real AOSP adbd

on:
  push:
    branches: [work/spake2-maven-migration]
    paths:
      - '.github/workflows/m3-adbd.yml'
      - 'validation/m3-maven/ci/**'
      - 'validation/native-adbd/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-adbd-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  native-adbd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify the unchanged Maven candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          git status --porcelain > evidence/initial-worktree.txt
          uname -a | tee evidence/host.log
          python3 scripts/prepare_spake2_candidate.py | tee evidence/spake2-repository.txt
          python3 scripts/source_bundle.py verify-spake2-maven --output evidence/spake2-candidate-integrity.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: m1-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Install SDK inputs and record the real toolchain
        run: |
          set -euo pipefail
          java -version 2>&1 | tee evidence/java-version.log
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/android-sdk.log
          ./gradlew --version 2>&1 | tee evidence/gradle-version.log
          cmake --version | tee evidence/cmake.log
          cp gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties evidence/
      - name: Compile the external Native consumer and disposable fixture
        id: build
        run: |
          set -euo pipefail
          ./gradlew :validation-native-adbd:linkDebugExecutableLinuxX64 :validation-native-adbd:linkPairingDebugExecutableLinuxX64 :validation-android-fixture:assembleDebug :kadb:verifySpake2MavenResolution -Pspake2Configurations=linuxX64CompileKlibraries --no-configuration-cache --no-build-cache --console=plain --stacktrace 2>&1 | tee evidence/native-build.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/
          python3 scripts/source_bundle.py verify-spake2-maven --spake2-resolution-report evidence/spake2-maven-resolution.json --output evidence/spake2-resolved-source-verification.json
          file validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe | tee evidence/consumer-file.log
          python3 -B -m unittest discover -s validation/native-adbd -p 'test_*.py' -v 2>&1 | tee evidence/driver-tests.log
      - name: Collect complete corresponding source for the actual Native binary
        id: source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/corresponding-source --cache "$RUNNER_TEMP/kadb-source-cache" --spake2-resolution-report evidence/spake2-maven-resolution.json --binary native-adbd=validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe 2>&1 | tee evidence/source-create.log
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          result = json.loads(Path('evidence/corresponding-source/source-bundle-result.json').read_text())
          assert result['status'] == 'verified' and result['kadb_commit'] == os.environ['GITHUB_SHA']
          lock_hash = hashlib.sha256(Path('validation/source-bundle/dependencies.lock.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha256={result['sha256']}\nlock-sha256={lock_hash}\n")
          PY
      - name: Preserve exact corresponding source
        id: source-upload
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corresponding-source-${{ github.sha }}
          path: evidence/corresponding-source/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Associate actual executed binaries with their source
        id: association
        if: ${{ !cancelled() && steps.source-upload.outcome == 'success' }}
        run: python3 validation/record-binary-evidence.py --source-url '${{ steps.source-upload.outputs.artifact-url }}' --source-sha256 '${{ steps.source.outputs.sha256 }}' --source-lock-sha256 '${{ steps.source.outputs.lock-sha256 }}' --output evidence
      - name: Provision one isolated disposable API 35 emulator
        id: provision
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update > evidence/host-packages.log 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libglu1-mesa >> evidence/host-packages.log 2>&1
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tee evidence/emulator-sdk.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/kadb-m3-android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kadb-m3-avd"
          export ANDROID_ADB_SERVER_PORT=5038
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb keygen "$ANDROID_USER_HOME/adbkey"
          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME/adbkey"
          printf 'no\n' | avdmanager create avd --name kadb_m3_adbd --package 'system-images;android-35;google_apis;x86_64'
          adb -P 5038 start-server
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee evidence/emulator-acceleration.log
          "$ANDROID_HOME/emulator/emulator" -avd kadb_m3_adbd -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader -memory 4096 -cores 2 -camera-back none -camera-front none > evidence/emulator.log 2>&1 &
          printf 'KADB_EMULATOR_PID=%s\nANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_ADB_SERVER_PORT=5038\nADB_VENDOR_KEYS=%s\n' "$!" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$ADB_VENDOR_KEYS" >> "$GITHUB_ENV"
          cp "$ANDROID_HOME/emulator/source.properties" evidence/emulator-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" evidence/system-image-source.properties
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml" evidence/system-image-package.xml
      - name: Require bounded boot, package manager and network readiness
        id: ready
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: python3 validation/m2-maven/android/wait_ready.py --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --adb-server-port 5038 --timeout 120 --output evidence/emulator-readiness
      - name: Execute Native public API against the real adbd
        id: adbd
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 validation/native-adbd/run_emulator.py --serial emulator-5554 --adb-server-port 5038 --adb "$ANDROID_HOME/platform-tools/adb" --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --emulator "$ANDROID_HOME/emulator/emulator" --consumer validation/native-adbd/build/bin/linuxX64/debugExecutable/kadb-native-adbd.kexe --apk validation/android-fixture/build/outputs/apk/debug/validation-android-fixture-debug.apk --output evidence/adbd 2>&1 | tee evidence/adbd-driver.log
      - name: Preserve runtime diagnostics and destroy this job's emulator and keys
        if: always()
        run: |
          timeout --kill-after=5s 15s adb -P 5038 devices -l > evidence/adb-final-devices.log 2>&1 || true
          timeout --kill-after=5s 20s adb -P 5038 -s emulator-5554 shell getprop > evidence/emulator-final-properties.log 2>&1 || true
          timeout --kill-after=5s 20s adb -P 5038 -s emulator-5554 logcat -d -v threadtime > evidence/emulator-logcat.log 2>&1 || true
          timeout --kill-after=5s 15s adb -P 5038 -s emulator-5554 emu kill || true
          if [ -n "${KADB_EMULATOR_PID:-}" ]; then kill "$KADB_EMULATOR_PID" 2>/dev/null || true; fi
          timeout --kill-after=5s 10s adb -P 5038 kill-server || true
          rm -rf "$RUNNER_TEMP/kadb-m3-android-user" "$RUNNER_TEMP/kadb-m3-avd"
      - name: Record actual M3 states independently
        if: always()
        env:
          M3_CANDIDATE: ${{ steps.candidate.outcome }}
          M3_BUILD: ${{ steps.build.outcome }}
          M3_SOURCE: ${{ steps.source.outcome }}
          M3_ASSOCIATION: ${{ steps.association.outcome }}
          M3_PROVISION: ${{ steps.provision.outcome }}
          M3_READY: ${{ steps.ready.outcome }}
          M3_ADBD: ${{ steps.adbd.outcome }}
        run: python3 validation/m3-maven/ci/summarize.py --evidence evidence
      - name: Preserve raw M3 evidence and actual executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-native-adbd-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: |
            evidence/
            !evidence/corresponding-source/*.tar.gz
            validation/native-adbd/build/bin/linuxX64/
            validation/android-fixture/build/outputs/apk/debug/*.apk
