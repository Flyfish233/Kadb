name: M2 Maven Darwin integration

on:
  push:
    branches: [work/spake2-maven-migration]
    paths:
      - '.github/workflows/m2-darwin.yml'
      - 'validation/m2-maven/darwin/**'
      - 'validation/m2-maven/baseline/darwin-arm-40331404006/Kadb-macosArm64.h'
      - 'kadb/**'
      - 'kadb-mdns/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - 'validation/source-bundle/dependencies.lock.json'
      - 'validation/native-adbd/**'
      - 'validation/pairing-peer/**'
      - 'validation/swift/**'
      - 'validation/boot-simulator.py'
      - 'validation/compare-objc-api.py'
      - 'validation/inspect-apple-artifact.py'
      - 'validation/summarize-tests.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-darwin-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  darwin:
    name: ${{ matrix.directory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
            target: MacosArm64
            directory: macosArm64
            platform: macos
            minimum: '12.0'
          - runner: macos-26-intel
            architecture: x86_64
            target: MacosX64
            directory: macosX64
            platform: macos
            minimum: '12.0'
          - runner: macos-26
            architecture: arm64
            target: IosSimulatorArm64
            directory: iosSimulatorArm64
            platform: ios-simulator
            minimum: '15.0'
          - runner: macos-26-intel
            architecture: x86_64
            target: IosX64
            directory: iosX64
            platform: ios-simulator
            minimum: '15.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze source and verify retained Maven candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          git status --porcelain=v1 > evidence/initial-worktree.txt
          python3 scripts/prepare_spake2_candidate.py | tee evidence/spake2-repository.txt
          python3 scripts/source_bundle.py verify-spake2-maven --output evidence/spake2-candidate-integrity.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: m2-darwin-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Record actual Apple toolchain and host
        id: environment
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.architecture }}'
          test -d "$DEVELOPER_DIR"
          uname -a | tee evidence/uname.log
          sw_vers | tee evidence/macos.log
          xcodebuild -version | tee evidence/xcode.log
          xcrun --sdk macosx --show-sdk-version | tee evidence/macos-sdk.log
          xcrun --sdk iphonesimulator --show-sdk-version | tee evidence/simulator-sdk.log
          xcrun simctl list --json > evidence/simulator-inventory.json
          java -version 2>&1 | tee evidence/java.log
          cmake --version | tee evidence/cmake.log
          ./gradlew --version 2>&1 | tee evidence/gradle.log
          cp gradle/libs.versions.toml gradle/wrapper/gradle-wrapper.properties evidence/
      - name: Compile Kadb, mDNS and independent consumer against Maven KLIBs
        id: compile
        run: |
          set -euo pipefail
          ./gradlew :kadb:compileKotlin${{ matrix.target }} :kadb:compileTestKotlin${{ matrix.target }} :kadb-mdns:compileKotlin${{ matrix.target }} :kadb-mdns:compileTestKotlin${{ matrix.target }} :validation-native-adbd:compileKotlin${{ matrix.target }} :validation-pairing-peer:writePeerClasspath :kadb:verifySpake2MavenResolution -Pspake2Configurations=${{ matrix.directory }}CompileKlibraries --continue --no-build-cache --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/compile.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/spake2-resolution-compile.json
          python3 scripts/source_bundle.py verify-spake2-maven --spake2-resolution-report evidence/spake2-resolution-compile.json --output evidence/spake2-resolved-source-verification.json
      - name: Link test executables, public framework and pairing consumer
        id: link
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./gradlew :kadb:linkDebugTest${{ matrix.target }} :kadb-mdns:linkDebugTest${{ matrix.target }} :kadb:linkDebugFramework${{ matrix.target }} :validation-native-adbd:linkPairingDebugExecutable${{ matrix.target }} :kadb:verifySpake2MavenResolution -Pspake2Configurations=${{ matrix.directory }}CompileKlibraries --continue --no-build-cache --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/link.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/spake2-resolution-link.json
      - name: Boot installed iOS Simulator with a bounded wait
        id: simulator
        if: ${{ !cancelled() && matrix.platform == 'ios-simulator' && steps.link.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 validation/boot-simulator.py 2>&1 | tee evidence/simulator-boot.log
      - name: Execute actual Kadb and mDNS platform regressions
        id: tests
        if: ${{ !cancelled() && steps.link.outcome == 'success' && (matrix.platform == 'macos' || steps.simulator.outcome == 'success') }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          kadb_command=(./gradlew :kadb:${{ matrix.directory }}Test :kadb-mdns:${{ matrix.directory }}Test :kadb:verifySpake2MavenResolution -Pspake2Configurations=${{ matrix.directory }}CompileKlibraries --continue --no-build-cache --no-configuration-cache --console=plain --stacktrace)
          if [ '${{ matrix.platform }}' = ios-simulator ]; then
            kadb_command+=(-PiosSimulatorDevice="$(cat evidence/simulator-udid.txt)")
          fi
          "${kadb_command[@]}" 2>&1 | tee evidence/tests.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/spake2-resolution-tests.json
      - name: Require actual test cases for both products
        id: test_evidence
        if: ${{ !cancelled() }}
        run: python3 validation/m2-maven/darwin/summarize.py tests --target '${{ matrix.directory }}' --output evidence/test-summary.json
      - name: Execute positive and wrong-code sessions with independent peer
        id: protocol
        if: ${{ !cancelled() && steps.link.outcome == 'success' && (matrix.platform == 'macos' || steps.simulator.outcome == 'success') }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          kadb_command=(python3 validation/pairing-peer/run_interop.py --java "$JAVA_HOME/bin/java" --classpath-file validation/pairing-peer/build/reference-classpath.txt --consumer validation/native-adbd/build/bin/${{ matrix.directory }}/pairingDebugExecutable/kadb-native-pairing.kexe --output evidence/pairing)
          if [ '${{ matrix.platform }}' = ios-simulator ]; then
            kadb_command+=(--simulator-udid "$(cat evidence/simulator-udid.txt)")
          fi
          "${kadb_command[@]}" 2>&1 | tee evidence/pairing-driver.log
      - name: Compare exported Objective-C public API independently of pairing
        id: api
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Headers/Kadb.h evidence/Kadb-${{ matrix.directory }}.h
          kadb_api_baseline=validation/baseline/darwin/Kadb-iosSimulatorArm64.h
          if [ '${{ matrix.platform }}' = macos ]; then
            kadb_api_baseline=validation/m2-maven/baseline/darwin-arm-40331404006/Kadb-macosArm64.h
          fi
          python3 validation/compare-objc-api.py "$kadb_api_baseline" evidence/Kadb-${{ matrix.directory }}.h --report evidence/objc-api.json 2>&1 | tee evidence/objc-api.log
          xcrun nm -gU kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Kadb > evidence/framework-symbols.log
      - name: Inspect actual framework architecture and deployment metadata
        id: framework
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        run: python3 validation/inspect-apple-artifact.py --artifact kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Kadb --architecture '${{ matrix.architecture }}' --platform '${{ matrix.platform }}' --maximum-minimum-os '${{ matrix.minimum }}' --output evidence/framework-metadata.json
      - name: Compile, link and execute external Swift consumer
        id: swift
        if: ${{ !cancelled() && matrix.platform == 'macos' && steps.link.outcome == 'success' }}
        timeout-minutes: 4
        run: validation/swift/run-macos.sh kadb/build/bin/${{ matrix.directory }}/debugFramework evidence/swift
      - name: Build and inspect the iOS device framework without claiming device execution
        id: ios_device_framework
        if: ${{ !cancelled() && matrix.directory == 'iosSimulatorArm64' && steps.link.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./gradlew :kadb:linkDebugFrameworkIosArm64 :kadb:verifySpake2MavenResolution -Pspake2Configurations=iosArm64CompileKlibraries --no-build-cache --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/ios-device-framework.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/spake2-resolution-ios-device.json
          python3 validation/inspect-apple-artifact.py --artifact kadb/build/bin/iosArm64/debugFramework/Kadb.framework/Kadb --architecture arm64 --platform ios --maximum-minimum-os 15.0 --output evidence/ios-device-framework-metadata.json
          cp kadb/build/bin/iosArm64/debugFramework/Kadb.framework/Headers/Kadb.h evidence/Kadb-iosArm64.h
          python3 validation/compare-objc-api.py validation/baseline/darwin/Kadb-iosSimulatorArm64.h evidence/Kadb-iosArm64.h --report evidence/ios-device-objc-api.json 2>&1 | tee evidence/ios-device-objc-api.log
      - name: Collect complete corresponding source bound to actual linked binaries
        id: source
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        run: |
          set -euo pipefail
          kadb_source_command=(python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/corresponding-source --cache "$RUNNER_TEMP/kadb-source-cache" --spake2-resolution-report evidence/spake2-resolution-link.json --binary ${{ matrix.directory }}-framework=kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Kadb --binary ${{ matrix.directory }}-pairing=validation/native-adbd/build/bin/${{ matrix.directory }}/pairingDebugExecutable/kadb-native-pairing.kexe --binary ${{ matrix.directory }}-test=kadb/build/bin/${{ matrix.directory }}/debugTest/test.kexe)
          if [ '${{ steps.ios_device_framework.outcome }}' = success ]; then
            kadb_source_command+=(--binary iosArm64-framework=kadb/build/bin/iosArm64/debugFramework/Kadb.framework/Kadb)
          fi
          "${kadb_source_command[@]}" 2>&1 | tee evidence/source-create.log
      - name: Record distinct phase results and binary inventory
        if: always()
        env:
          M2_STEPS_JSON: ${{ toJSON(steps) }}
          M2_TARGET: ${{ matrix.directory }}
          M2_RUNNER: ${{ matrix.runner }}
          M2_ARCHITECTURE: ${{ matrix.architecture }}
          M2_PLATFORM: ${{ matrix.platform }}
        run: python3 validation/m2-maven/darwin/summarize.py verdict --output evidence/platform-status.json
      - name: Preserve compact raw logs and test evidence before large binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m2-darwin-evidence-${{ matrix.directory }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
          path: |
            evidence/
            !evidence/corresponding-source/*.tar.gz
            !evidence/corresponding-source/*.partial
            !evidence/swift/swift-consumer
            kadb/build/test-results/${{ matrix.directory }}Test/
            kadb-mdns/build/test-results/${{ matrix.directory }}Test/
            kadb/build/bin/${{ matrix.directory }}/debugFramework/Kadb.framework/Headers/Kadb.h
      - name: Preserve raw evidence including failed phase logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m2-darwin-${{ matrix.directory }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            evidence/
            kadb/build/reports/spake2-maven-resolution.json
            kadb/build/test-results/${{ matrix.directory }}Test/
            kadb-mdns/build/test-results/${{ matrix.directory }}Test/
            kadb/build/reports/tests/${{ matrix.directory }}Test/
            kadb-mdns/build/reports/tests/${{ matrix.directory }}Test/
            kadb/build/bin/${{ matrix.directory }}/
            kadb-mdns/build/bin/${{ matrix.directory }}/
            validation/native-adbd/build/bin/${{ matrix.directory }}/
            kadb/build/bin/iosArm64/debugFramework/
