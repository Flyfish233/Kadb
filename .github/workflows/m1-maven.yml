name: M1 fixed Maven migration

on:
  push:
    branches: [work/spake2-maven-migration]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'validation/m1-maven/runtime/**'
      - 'validation/m1-maven/review/**'
      # M3-only integration harnesses do not alter M1 production inputs.
      - '.github/workflows/m3-adbd.yml'
      - 'validation/m3-maven/**'
      - 'validation/native-adbd/**'
      # M4-only authentication tooling is exercised by its dedicated workflow.
      - '.github/workflows/m4-auth.yml'
      - 'validation/m4-maven/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-maven-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

# M1 keeps Android host and Linux Native independent. This workflow does not
# start Apple, emulator, physical-device, or protocol-pairing matrices.
jobs:
  m1-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify the retained fixed Maven candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          python3 scripts/prepare_spake2_candidate.py | tee evidence/spake2-repository.txt
          python3 scripts/source_bundle.py verify-spake2-maven --output evidence/spake2-candidate-integrity.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: m1-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Verify bounded candidate restoration and source collector regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s validation/m1-maven/tests -p 'test_prepare_candidate.py' -v 2>&1 | tee evidence/candidate-restore-tests.log
          python3 -m unittest discover -s validation/source-bundle -p 'test_*.py' -v 2>&1 | tee evidence/source-tests.log
      - name: Record toolchain and install the pinned Android SDK
        run: |
          set -euo pipefail
          java -version 2>&1 | tee evidence/java-version.log
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 2>&1 | tee evidence/sdk.log
          ./gradlew --version 2>&1 | tee evidence/gradle-version.log
          cp gradle/libs.versions.toml evidence/libs.versions.toml
          cp gradle/wrapper/gradle-wrapper.properties evidence/gradle-wrapper.properties
      - name: Exercise actual Gradle Maven variants and fail-closed negative cases
        env:
          KADB_RUN_GRADLE_GATE_TESTS: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s validation/m1-maven/tests -p 'test_gradle_resolution.py' -v 2>&1 | tee evidence/gradle-gate-tests.log
      - name: Compile the actual Kadb AAR, run host regressions and verify selected Maven binaries
        id: host-build
        run: |
          set -euo pipefail
          ./gradlew :kadb:verifyProductionTargetScope :kadb:verifySpake2MavenResolution :kadb:testAndroidHostTest :kadb:bundleAndroidMainAar --no-build-cache --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/host-build.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/
          python3 scripts/source_bundle.py verify-spake2-maven --spake2-resolution-report kadb/build/reports/spake2-maven-resolution.json --output evidence/spake2-resolved-source-verification.json
      - name: Require actual host test execution
        if: always()
        run: python3 validation/summarize-tests.py . --output evidence/test-summary.json --require kadb/build/test-results/testAndroidHostTest
      - name: Collect complete corresponding source against actual Maven resolution
        if: always() && steps.host-build.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/corresponding-source --cache "$RUNNER_TEMP/kadb-source-cache" --spake2-resolution-report kadb/build/reports/spake2-maven-resolution.json --binary kadb-android-aar=kadb/build/outputs/aar/kadb.aar 2>&1 | tee evidence/source-create.log
      - name: Preserve executed M1 evidence and failure logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-maven-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            evidence/
            kadb/build/reports/spake2-maven-resolution.json
            kadb/build/test-results/testAndroidHostTest/
            kadb/build/reports/tests/testAndroidHostTest/
            kadb/build/outputs/aar/

  m1-linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify the retained fixed Maven candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          python3 scripts/prepare_spake2_candidate.py | tee evidence/spake2-repository.txt
          python3 scripts/source_bundle.py verify-spake2-maven --output evidence/spake2-candidate-integrity.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kadb-source-cache
          key: m1-sources-${{ hashFiles('validation/source-bundle/dependencies.lock.json') }}
      - name: Record Linux toolchain identity
        run: |
          set -euo pipefail
          java -version 2>&1 | tee evidence/java-version.log
          cmake --version 2>&1 | tee evidence/cmake-version.log
          ./gradlew --version 2>&1 | tee evidence/gradle-version.log
          cp gradle/libs.versions.toml evidence/libs.versions.toml
          cp gradle/wrapper/gradle-wrapper.properties evidence/gradle-wrapper.properties
      - name: Compile, link and execute Kadb Linux Native against the actual Maven KLIBs
        id: native-build
        run: |
          set -euo pipefail
          ./gradlew :kadb:verifyProductionTargetScope :kadb:verifySpake2MavenResolution :kadb:linuxX64Test -Pspake2Configurations=linuxX64CompileKlibraries --no-build-cache --no-configuration-cache --console=plain --stacktrace 2>&1 | tee evidence/linux-native.log
          cp kadb/build/reports/spake2-maven-resolution.json evidence/
          python3 scripts/source_bundle.py verify-spake2-maven --spake2-resolution-report kadb/build/reports/spake2-maven-resolution.json --output evidence/spake2-resolved-source-verification.json
      - name: Require actual Linux Native test execution
        if: always()
        run: python3 validation/summarize-tests.py . --output evidence/test-summary.json --require kadb/build/test-results/linuxX64Test
      - name: Collect complete corresponding source against actual Native Maven resolution
        if: always() && steps.native-build.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/source_bundle.py create --repo "$PWD" --ref "$GITHUB_SHA" --output evidence/corresponding-source --cache "$RUNNER_TEMP/kadb-source-cache" --spake2-resolution-report kadb/build/reports/spake2-maven-resolution.json 2>&1 | tee evidence/source-create.log
      - name: Preserve executed M1 Native evidence and failure logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-maven-linux-native-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            evidence/
            kadb/build/reports/spake2-maven-resolution.json
            kadb/build/test-results/linuxX64Test/
            kadb/build/reports/tests/linuxX64Test/
            kadb/build/bin/linuxX64/
            kadb/build/classes/kotlin/linuxX64/
